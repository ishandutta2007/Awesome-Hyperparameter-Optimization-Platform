<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Geometric Elements -->
  <g opacity="0.25">
    <!-- Pulsing Neural Network Grid Simulation -->
    <circle cx="150" cy="80" r="40" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="30;50;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="220" r="60" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="r" values="45;75;45" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Moving Hyperparameter Optimization Curves -->
    <path d="M0,200 Q300,50 600,220 T1200,100" fill="none" stroke="url(#text-grad)" stroke-width="3" stroke-dasharray="10 5">
      <animate attributeName="stroke-dashoffset" values="0;150" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0,100 Q400,280 800,80 T1200,250" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Floating Data Nodes -->
    <circle cx="300" cy="70" r="5" fill="#38bdf8">
      <animate attributeName="cy" values="70;55;70" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="240" r="6" fill="#c084fc">
      <animate attributeName="cy" values="240;255;240" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="260" r="4" fill="#818cf8">
      <animate attributeName="cy" values="260;245;260" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="1">
      Awesome Hyperparameter Optimization
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#e2e8f0" letter-spacing="0.5">
      SaaS Platforms • Bayesian Optimization • AutoML • Neural Architecture Search
    </text>

    <!-- Category Pill Tag -->
    <rect x="475" y="215" width="250" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="600" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" letter-spacing="1">
      CURATED ECOSYSTEM DIRECTORY
    </text>
  </g>
</svg>
